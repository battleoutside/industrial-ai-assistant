spring:
  config:
    import: optional:file:.env[.properties] #加载.env文件的环境变量DASHSCOPE_API_KEY
  application:
    name: industrial-ai-assistant

server:
  port: 8081
  servlet:
    context-path: /api

langchain4j:
  community:
    dashscope:
      chat-model:
        model-name: qwen-plus
        api-key: ${DASHSCOPE_API_KEY} # 阿里云百炼 API Key
      embedding-model:
        model-name: text-embedding-v2
        api-key: ${DASHSCOPE_API_KEY}
      streaming-chat-model:
        model-name: qwen-plus
        api-key: ${DASHSCOPE_API_KEY}


bigmodel:
  api-key: ${BIGMODEL_API_KEY} # 智谱 MCP API Key